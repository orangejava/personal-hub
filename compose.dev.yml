services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_hub
      POSTGRES_USER: personal_hub
      POSTGRES_PASSWORD: personal_hub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - personal_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_hub -d personal_hub"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass personal_hub_redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - personal_hub_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a personal_hub_redis_dev_password ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: personal_hub_minio
      MINIO_ROOT_PASSWORD: personal_hub_minio_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - personal_hub_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 personal_hub_minio personal_hub_minio_dev_secret &&
      mc mb --ignore-existing local/personal-hub-dev &&
      mc anonymous set none local/personal-hub-dev &&
      printf '%s' '{"CORSRules":[{"AllowedOrigins":["http://localhost:8000","http://localhost:8001"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Length"],"MaxAgeSeconds":3600}]}' > /tmp/cors.json &&
      mc cors set /tmp/cors.json local/personal-hub-dev
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - personal_hub_mailpit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  personal_hub_postgres_data:
  personal_hub_redis_data:
  personal_hub_minio_data:
  personal_hub_mailpit_data:
