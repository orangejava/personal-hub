# 证书申请阶段的临时 Nginx 配置。
# 仅允许 HTTP-01 challenge 和现有 HTTP 业务流量，不引用尚不存在的证书。
upstream nest_server {
    server server:3001;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 80;
    listen [::]:80;
    server_name personalhub.center www.personalhub.center _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/v1/ {
        gzip off;
        proxy_pass http://nest_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~* '\.[0-9a-f]{8,}(?:\.(?:async|chunk))?\.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$' {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache";
    }

    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
