# 生产同站分流。证书由宿主机 Certbot 管理，通过 Compose 只读挂载进 Nginx；本仓库不放证书或私钥。
# Nest 只信任本 Nginx 写入的 X-Forwarded-*，不要把客户端自带头原样当可信 IP。

upstream nest_server {
    server server:3001;
}

# 静态资源压缩。接口在自己的 location 里关掉，避免 SSE 被压成一整包。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# 只允许现代 TLS 版本；证书由 /etc/nginx/certs 挂载提供。
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_prefer_server_ciphers off;

# 80 先保留 ACME challenge，其余请求统一跳主域名 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name personalhub.center www.personalhub.center _;
    root /usr/share/nginx/html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://personalhub.center$request_uri;
    }
}

# www 只做规范化跳转，不承载业务内容。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.personalhub.center;

    ssl_certificate /etc/nginx/certs/live/personalhub.center/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/personalhub.center/privkey.pem;
    add_header Strict-Transport-Security "max-age=86400" always;

    return 301 https://personalhub.center$request_uri;
}

# 主业务 HTTPS 入口。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name personalhub.center;
    root /usr/share/nginx/html;
    client_max_body_size 8m;

    ssl_certificate /etc/nginx/certs/live/personalhub.center/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/personalhub.center/privkey.pem;
    add_header Strict-Transport-Security "max-age=86400" always;

    location /api/v1/ {
        gzip off;
        proxy_pass http://nest_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header Connection "";
        # SSE / 长请求不要缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Umi 入口是「哈希.js / 哈希.css」，路由分包是「哈希.async.js」，样式分包是「哈希.chunk.css」。
    # 文件名变了才会换地址，所以可以长期缓存。
    # 花括号必须放进引号，否则 Nginx 会把它当成配置块，启动直接退出。
    # 用单引号，避免结尾的 $ 被当成变量。
    location ~* '\.[0-9a-f]{8,}(?:\.(?:async|chunk))?\.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$' {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache";
    }

    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
